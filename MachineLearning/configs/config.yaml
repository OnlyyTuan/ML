# Cấu hình dự án dự đoán thời gian giao hàng (Olist)
# Các đường dẫn tương đối tính từ thư mục gốc dự án (MachineLearning/)

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  model_path: models/delivery_model.joblib
  metrics_path: models/metrics.json

preprocess:
  outlier_quantile: 0.995      # bỏ các đơn có delivery_days lớn hơn quantile này
  # Chia theo thời gian đặt hàng (không xáo trộn) để tránh rò rỉ tương lai
  val_size: 0.15
  test_size: 0.15

features:
  target: delivery_days
  numeric:
    - purchase_month
    - purchase_dayofweek
    - purchase_hour
    - purchase_is_weekend
    - approval_hours
    - estimated_days
    - n_items
    - n_products
    - n_sellers
    - total_price
    - max_price
    - total_freight
    - freight_ratio
    - total_weight_g
    - max_weight_g
    - total_volume_cm3
    - mean_photos_qty
    - customer_lat
    - customer_lng
    - seller_lat
    - seller_lng
    - distance_km
    - same_state
    - same_city
  categorical:
    - product_category_name
    - customer_state
    - seller_state

model:
  type: hist_gradient_boosting   # sklearn HistGradientBoostingRegressor
  params:
    loss: absolute_error         # tối ưu MAE, bền với ngoại lai
    learning_rate: 0.05
    max_iter: 1000
    max_leaf_nodes: 63
    min_samples_leaf: 40
    l2_regularization: 1.0
    early_stopping: true
    validation_fraction: 0.1
    n_iter_no_change: 30
    random_state: 42
